name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/phase3-litertlm-local-ai
    paths:
      - 'JARVIS-Phase3-LiteRTLM-corrected-review.zip'
      - 'JARVIS-security-hardened-working-copy.zip'
      - '.github/workflows/build-Jarvis.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract selected source package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f JARVIS-Phase3-LiteRTLM-corrected-review.zip ]; then
            PACKAGE="JARVIS-Phase3-LiteRTLM-corrected-review.zip"
            PROJECT="source"
          else
            PACKAGE="JARVIS-security-hardened-working-copy.zip"
            PROJECT="source/Jarvis-master"
          fi
          echo "Selected package: $PACKAGE"
          unzip -q "$PACKAGE" -d source
          test -f "$PROJECT/pubspec.yaml"
          test -f "$PROJECT/android/gradle/wrapper/gradle-wrapper.properties"
          test -f "$PROJECT/android/settings.gradle" || test -f "$PROJECT/android/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Resolve compatible Flutter dependency constraints
        working-directory: \${{ github.workspace }}/\${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          s = p.read_text()
          s, count = re.subn(r'(?m)^(\s*share_plus:\s*)\^13\.3\.0\s*$', r'\g<1>^12.0.2', s)
          if count != 1:
              raise SystemExit("Expected exactly one share_plus ^13.3.0 constraint")
          p.write_text(s)
          print("Pinned share_plus to ^12.0.2 to resolve win32 constraint conflict with flutter_secure_storage ^9.2.4")
          PY

      - name: Install Flutter dependencies
        working-directory: \${{ github.workspace }}/\${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Check Flutter project
        working-directory: \${{ github.workspace }}/\${{ env.PROJECT_DIR }}
        run: flutter doctor -v

      - name: Analyze Flutter project
        working-directory: \${{ github.workspace }}/\${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: \${{ github.workspace }}/\${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: \${{ github.workspace }}/\${{ env.PROJECT_DIR }}
        run: flutter build apk --release --verbose

      - name: Verify APK
        working-directory: \${{ github.workspace }}/\${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: \${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Diagnostics
          path: |
            \${{ env.PROJECT_DIR }}/build/
            \${{ env.PROJECT_DIR }}/android/
          retention-days: 7
          if-no-files-found: ignore
