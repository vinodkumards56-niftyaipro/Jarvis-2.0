name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/phase3-litertlm-local-ai
    paths:
      - 'JARVIS-Phase3-LiteRTLM-corrected-review.zip'
      - 'JARVIS-security-hardened-working-copy.zip'
      - '.github/workflows/build-Jarvis.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract selected source package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f JARVIS-Phase3-LiteRTLM-corrected-review.zip ]; then
            PACKAGE="JARVIS-Phase3-LiteRTLM-corrected-review.zip"
            PROJECT="source"
          else
            PACKAGE="JARVIS-security-hardened-working-copy.zip"
            PROJECT="source/Jarvis-master"
          fi
          echo "Selected package: $PACKAGE"
          unzip -q "$PACKAGE" -d source
          test -f "$PROJECT/pubspec.yaml"
          test -f "$PROJECT/android/gradle/wrapper/gradle-wrapper.properties"
          test -f "$PROJECT/android/settings.gradle" || test -f "$PROJECT/android/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Prevent continuous animations from timing out widget tests
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/widget_test.dart")
          source = path.read_text()

          # Widget tests run without Android/iOS plugin registrants. Register
          # deterministic test-only handlers for the native channels touched
          # during app/settings initialisation.
          if "package:flutter/services.dart" not in source:
              newline = chr(10)
              imports = (
                  "import 'dart:io';" + newline + newline
                  + "import 'package:flutter/material.dart';" + newline
                  + "import 'package:flutter/services.dart';"
              )
              source = source.replace(
                  "import 'package:flutter/material.dart';",
                  imports,
                  1,
              )
          if "setUpAll(() {" not in source:
              setup = """  final secureValues = <String, String>{};

          setUp(() {
            secureValues.clear();
          });

          setUpAll(() {
            const secureStorage = MethodChannel('plugins.it_nomads.com/flutter_secure_storage');
            TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                .setMockMethodCallHandler(secureStorage, (call) async {
              final args = call.arguments is Map
                  ? Map<String, dynamic>.from(call.arguments as Map)
                  : <String, dynamic>{};
              final key = args['key'] as String?;
              switch (call.method) {
                case 'read':
                  return key == null ? null : secureValues[key];
                case 'readAll':
                  return Map<String, String>.from(secureValues);
                case 'containsKey':
                  return key != null && secureValues.containsKey(key);
                case 'write':
                  final value = args['value'] as String?;
                  if (key != null && value != null) {
                    secureValues[key] = value;
                  }
                  return null;
                case 'delete':
                  if (key != null) secureValues.remove(key);
                  return null;
                case 'deleteAll':
                  secureValues.clear();
                  return null;
                default:
                  return null;
              }
            });

            const pathProvider = MethodChannel('plugins.flutter.io/path_provider');
            TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                .setMockMethodCallHandler(pathProvider, (call) async {
              return Directory.systemTemp.path;
            });

            const accessibility = MethodChannel('com.privateagent/accessibility');
            TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                .setMockMethodCallHandler(accessibility, (call) async {
              if (call.method == 'startMacroRecording') return false;
              return null;
            });
          });

          """
              source = source.replace("void main() {" + chr(10), "void main() {" + chr(10) + setup, 1)

          first_start = source.index("testWidgets('app boots into onboarding on first run'")
          second_start = source.index("testWidgets('custom Ollama model survives unrelated settings changes'")
          group_start = source.index("  group('JARVIS & Hermes Workflow tests'", second_start)

          first = source[first_start:second_start]
          second = source[second_start:group_start]

          if first.count("await tester.pumpAndSettle();") != 1:
              raise SystemExit("Unexpected onboarding test structure; no changes applied")
          if second.count("await tester.pumpAndSettle();") != 4:
              raise SystemExit("Unexpected Ollama settings test structure; no changes applied")

          first = first.replace(
              "await tester.pumpAndSettle();",
              "await tester.pump(const Duration(seconds: 2));",
          )
          replacements = [
              "await tester.pump(const Duration(seconds: 1));",
              "await tester.pump(const Duration(milliseconds: 300));",
              "await tester.pump(const Duration(milliseconds: 300));",
              "await tester.pump(const Duration(milliseconds: 300));",
              "await tester.pump(const Duration(milliseconds: 500));",
          ]
          for replacement in replacements:
              second = second.replace(
                  "await tester.pumpAndSettle();",
                  replacement,
                  1,
              )

          # Keep the settings test interactions inside the test viewport.
          # Fixed-duration pumps avoid infinite animations but do not scroll controls into view.
          second = second.replace(
              "await tester.tap(find.text('Send system prompt'));",
              "await tester.ensureVisible(find.text('Send system prompt'));\n  await tester.pump();\n  await tester.tap(find.text('Send system prompt'));",
              1,
          )
          second = second.replace(
              "await tester.tap(find.text('Save changes'));",
              "await tester.ensureVisible(find.text('Save changes'));\n  await tester.pump();\n  await tester.tap(find.text('Save changes'));",
              1,
          )

          source = source[:first_start] + first + second + source[group_start:]
          path.write_text(source)
          print("Applied bounded frame pumping to the two timing-out widget tests; assertions and test coverage remain unchanged.")
          PY

      - name: Resolve compatible Flutter dependency constraints
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()
          s, count = re.subn(r'(?m)^(\s*share_plus:\s*)\^13\.3\.0\s*$', r'\g<1>^12.0.2', s)
          if count != 1:
              raise SystemExit("Expected exactly one share_plus ^13.3.0 constraint")
          p.write_text(s)
          print("Pinned share_plus to ^12.0.2 for flutter_secure_storage compatibility")

          # Flutter 3.50.1 requires Gradle 9.3.1 or newer.
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          w = wrapper.read_text()
          w, count = re.subn(
              r'(?m)^(distributionUrl=.*gradle-)9\.1\.0(-all\.zip)$',
              r'\g<1>9.3.1\g<2>',
              w,
          )
          if count != 1:
              raise SystemExit("Expected exactly one Gradle 9.1.0 wrapper URL")
          wrapper.write_text(w)
          print("Updated CI Gradle wrapper to 9.3.1 for Flutter 3.50.1")
          PY

      - name: Install Flutter dependencies
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Check Flutter project
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter doctor -v

      - name: Analyze Flutter project
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter build apk --release --verbose

      - name: Verify APK
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/build/
            ${{ env.PROJECT_DIR }}/android/
          retention-days: 7
          if-no-files-found: ignore
,
              r'\\g<1>9.3.1\\g<2>',
              w,
          )
          if count != 1:
              raise SystemExit("Expected exactly one Gradle 9.1.0 wrapper distribution URL")
          wrapper.write_text(w)
          print("Updated CI workspace Gradle wrapper to 9.3.1 for Flutter 3.50.1")
          PY

      - name: Install Flutter dependencies
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Check Flutter project
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter doctor -v

      - name: Analyze Flutter project
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: flutter build apk --release --verbose

      - name: Verify APK
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/build/
            ${{ env.PROJECT_DIR }}/android/
          retention-days: 7
          if-no-files-found: ignore
